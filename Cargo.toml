[package]
name = "piaf"
version = "0.1.0"
edition = "2024"

[lib]
name = "piaf"
crate-type = ["cdylib", "rlib"]

[dependencies]
freya = { version = "0.4.0-rc.18", features = [
  "sdk",
  "devtools",
  "router",
] } # { path = "../freya/crates/freya", features = ["sdk", "devtools"] }
freya-components = "0.4.0-rc.18"
freya-core = "0.4.0-rc.18"
freya-engine = "0.4.0-rc.18"
freya-material-design = "0.4.0-rc.18" # { path = "../freya/crates/freya-material-design" }
freya-icons = { version = "0.4.0-rc.18", features = [
  "lucide",
] } # { path = "../freya/crates/freya-icons", features = ["lucide"] }
freya-router = "0.4.0-rc.18" # { path = "../freya/crates/freya-router" }
freya-query = "0.4.0-rc.18" # { path = "../freya/crates/freya-query" }
freya-radio = "0.4.0-rc.18" # { path = "../freya/crates/freya-radio" }
matrix-sdk = { version = "0.16.0", default-features = false, features = [
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "bundled-sqlite",
  "rustls-tls",
] }
matrix-sdk-ui = { version = "0.16.0", default-features = false, features = [
  "rustls-tls",
] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
matrix-sdk-crypto = "0.16.0"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
dirs = "6.0.0"
rand = "0.9.2"
rand_distr = "0.5.1"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
eyeball-im = "0.8"
mime = "0.3"

[target.'cfg(not(target_os="android"))'.dependencies]
console-subscriber = "0.5.0"
rfd = "0.15"

[target.'cfg(target_os="android")'.dependencies]
freya-android = { version = "0.4.0-rc.18", features = ["skia-engine"] }
freya-winit = "0.4.0-rc.18"
android_logger = "0.15"
log = "0.4"
winit = { version = "0.30", features = ["android-native-activity", "rwh_06"] }
jni = { version = "0.21", default-features = false }

# Compile dependencies with light optimization so they don't bottleneck incremental builds
[profile.dev.package."*"]
opt-level = 1
