[package]
name = "piaf"
version = "0.1.0"
edition = "2024"

[lib]
name = "piaf"
crate-type = ["cdylib", "rlib"]

[dependencies]
freya = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum", features = [
  "sdk",
  "devtools",
  "router",
] }
freya-components = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
freya-core = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
freya-engine = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
freya-material-design = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
freya-icons = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum", features = [
  "lucide",
] }
freya-router = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
freya-query = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
freya-radio = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
matrix-sdk = { version = "0.16.0", default-features = false, features = [
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "bundled-sqlite",
  "rustls-tls",
] }
matrix-sdk-ui = { version = "0.16.0", default-features = false, features = [
  "rustls-tls",
] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
matrix-sdk-crypto = "0.16.0"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
dirs = "6.0.0"
rand = "0.9.2"
rand_distr = "0.5.1"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
eyeball-im = "0.8"
mime = "0.3"
blurhash = "0.2.3"
png = "0.18.1"

[target.'cfg(not(target_os="android"))'.dependencies]
console-subscriber = "0.5.0"
rfd = "0.15"

[target.'cfg(target_os="android")'.dependencies]
freya-android = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum", features = ["skia-engine"] }
freya-winit = { git = "https://github.com/henri2h/freya", branch = "henri2h/momentum" }
android_logger = "0.15"
log = "0.4"
winit = { version = "0.30", features = ["android-native-activity", "rwh_06"] }
jni = { version = "0.21", default-features = false }

# Compile dependencies with light optimization so they don't bottleneck incremental builds
[profile.dev.package."*"]
opt-level = 1
