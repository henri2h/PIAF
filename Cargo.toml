[package]
name = "piaf"
version = "0.1.0"
edition = "2024"

[lib]
name = "piaf"
crate-type = ["cdylib", "rlib"]

[features]
hotreload = ["freya/hotreload"]

[dependencies]
freya = { path = "../../rust/freya/crates/freya", features = [
  "sdk",
  "router",
  "markdown",
] }
freya-components = { path = "../../rust/freya/crates/freya-components" }
freya-core = { path = "../../rust/freya/crates/freya-core" }
freya-engine = { path = "../../rust/freya/crates/freya-engine" }
freya-material-design = { path = "../../rust/freya/crates/freya-material-design" }
freya-icons = { path = "../../rust/freya/crates/freya-icons", features = [
  "lucide",
] }
freya-router = { path = "../../rust/freya/crates/freya-router" }
freya-query = { path = "../../rust/freya/crates/freya-query" }
freya-radio = { path = "../../rust/freya/crates/freya-radio" }
ruma = { version = "0.15.1", features = ["client-api-c", "unstable-msc2666"] }
matrix-sdk = { version = "0.17.0", default-features = false, features = [
  "e2e-encryption",
  "automatic-room-key-forwarding",
  "bundled-sqlite",
] }
matrix-sdk-ui = { version = "0.17.0", default-features = false, features = [] }
tokio = { version = "1.15.3", features = ["macros", "rt-multi-thread"] }
matrix-sdk-crypto = "0.17.0"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
dirs = "6.0.0"
rand = "0.10.1"
rand_distr = "0.6.0"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
eyeball-im = "0.8"
mime = "0.3"
blurhash = "0.2.3"
png = "0.18.1"

[target.'cfg(not(target_os="android"))'.dependencies]
console-subscriber = "0.5.0"
rfd = "0.15"

[target.'cfg(target_os="android")'.dependencies]
freya-android = { path = "../../rust/freya/crates/freya-android", features = [
  "skia-engine",
] }
freya-winit = { path = "../../rust/freya/crates/freya-winit" }
android_logger = "0.15"
log = "0.4"
winit = { version = "0.30", features = ["android-native-activity", "rwh_06"] }
jni = { version = "0.21", default-features = false }

# Compile dependencies with light optimization so they don't bottleneck incremental builds
[profile.dev.package."*"]
opt-level = 1
